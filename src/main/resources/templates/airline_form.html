<<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>VUELOS Udea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        .form-container {
            max-width: 500px;
            margin: auto;
        }
        label {
            margin: 10px 0 5px;
        }
        .error {
            color: red;
            font-size: 0.9em;
            margin-bottom: 10px;
            display: block;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }

        .form-control, .form-select {
            display: block;
            width: 100%;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>VUELOS</h2>
    <form th:action="@{/flight/evaluate}" th:object="${Request}" method="post">
        <h3>Datos del pasajero</h3>

        <label for="name">Nombre:</label>
        <input type="text" id="name" th:field="${Request.passenger.name}" class="form-control">
        <span class="error" th:errors="${Request.passenger.name}"></span>

        <label for="age">Edad:</label>
        <input type="number" min="0" id="age" th:field="${Request.passenger.age}" class="form-control">
        <span class="error" th:errors="${Request.passenger.age}"></span>

        <label for="membership">Membresía:</label>
        <select id="membership" th:field="${Request.passenger.status}" class="form-select">
            <option value="Basic">Basic</option>
            <option value="Gold">Gold</option>
            <option value="Platinum">Platinum</option>
            <option value="Business">Business</option>
        </select>

        <hr>
            <h3>Equipaje y preferencias</h3>
        <hr>

        <label for="seatPref">Preferencia de asiento:</label>
        <select id="seatPref" th:field="${Request.passenger.seatPreference}" class="form-select">
            <option value="Window">Window</option>
            <option value="Aisle">Aisle</option>
            <option value="Familiar">Familiar</option>
            <option value="Any">Any</option>
        </select>

        <label for="weight">Peso de equipaje (kg):</label>
        <input type="number" min='0' id="weight" th:field="${Request.passenger.luggage.weight}" step="1" class="form-control">
        <span class="error" th:errors="${Request.passenger.luggage.weight}"></span>

        <div class="form-check mt-3 mb-3 d-flex align-items-center">
            <input class="form-check-input me-2" type="checkbox" id="travelingWithChildren" th:field="${Request.passenger.travelingWithChildren}">
            <label class="form-check-label" for="travelingWithChildren">Viaja con niños</label>
        </div>
        <button type="submit">Evaluar vuelo</button>
    </form>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
    <title>VUELOS Udea</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        .form-container {
            max-width: 500px;
            margin: auto;
        }
        label {
            display: block;
            margin: 10px 0 5px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 5px;
        }
        .error {
            color: red;
            font-size: 0.9em;
            margin-bottom: 10px;
            display: block;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>VUELOS</h2>
    <form th:action="@{/credit/evaluate}" th:object="${Request}" method="post">
        <h3>Datos del pasajero</h3>
        <label for="name">Nombre:</label>
        <input type="text" id="name" th:field="${}">
        <span class="error" th:errors="${}"></span>

        <label for="age">Edad:</label>
        <input type="number" id="age" th:field="${}">
        <span class="error" th:errors="${}"></span>

        <label for="creditType">Menbresia</label>
        <select id="creditType" th:field="${}">
            <option value="">Gold</option>
            <option value="">Platinum</option>
            <option value="">Basic</option>
        </select>
        <hr>
        <h3>Equipaje y prefencias</h3>
        <hr>
        <label for="Preferencia de asiento">Preferencia de asiento:</label>
        <select id="preference" th:field="${}">
            <option value="">Ventana</option>
            <option value="">Pasillo</option>
            <option value="">Familiar</option>
        </select>

        <label for="equipaje">Peso de equipaje(kg):</label>
        <input type="number" id="luggage" th:field="${}" step="1">
        <span class="error" th:errors="${}"></span>
        <span class="error" th:errors="${}"></span>

        <button type="submit">Evaluar vuelo</button>
    </form>
</div>
</body>
</html>

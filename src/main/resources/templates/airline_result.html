<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <meta charset="UTF-8">
  <title>Resultado de Evaluación</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    .result-container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .approved {
      color: green;
    }
    .rejected {
      color: red;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #4CAF50;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- <div th:if='${response != null and response.passenger != null}' class="result-container">\ -->
  <div class="result-container">
    <h2><i class="bi bi-check-circle-fill"></i>Pase de abordar</h2>

    <div class="info-item">
      <span class="label">Nombre:</span>
      <span class="value" th:text="${response.passenger.name}"></span>
    </div>

    <div class="info-item">
      <span class="label">Edad:</span>
      <span class="value" th:text="${response.passenger.age}"></span>
    </div>

    <div class="info-item">
      <span class="label">Membresía:</span>
      <span class="value" th:text="${response.passenger.status}"></span>
    </div>

    <div class="info-item">
      <span class="label">Viaja con niños:</span>
      <span class="value" th:text="${response.passenger.travelingWithChildren}"></span>
    </div>

    <div class="info-item">
      <span class="label">Preferencia de asiento:</span>
      <span class="value" th:text="${response.passenger.seatPreference}"></span>
    </div>

    <div class="info-item">
      <span class="label">Duración del vuelo:</span>
      <span class="value" th:text="${response.passenger.flight.duration} + ' horas'"></span>
    </div>

    <div class="info-item">
      <span class="label">Retraso:</span>
      <span class="value" th:text="${response.passenger.flight.delay} + ' minutos'"></span>
    </div>

      <div class="info-item">
        <span class="label">Asiento asignado:</span>
        <span class="value" th:text="${response.passenger.assignedSeat.type}"></span>
      </div>

    <div class="info-item">
      <span class="label">Check-in prioritario:</span>
      <span class="value" th:text="${response.passenger.priorityCheckIn}"></span>
    </div>

    <div class="info-item">
      <span class="label">Descuento:</span>
      <span class="value" th:text="${response.passenger.luggage.discount}"></span>
    </div>

    <div class="info-item">
      <span class="label">Elegible para ascenso:</span>
      <span class="value" th:text="${response.passenger.upgradeToBusinessClass}"></span>
    </div>

    <div class="info-item">
      <span class="label">Compensación ($):</span>
      <span class="value" th:text="${response.passenger.compensation}"></span>
    </div>

    <div class="info-item">
      <span class="label">Puntos de lealtad:</span>
      <span class="value" th:text="${response.passenger.loyaltyPoints}"></span>
    </div>

    <div class="info-item">
      <span class="label">Equipaje permitido:</span>
      <span class="value" th:text="${response.passenger.luggage.allowed}"></span>
    </div>

    <div class="info-item">
      <span class="label">Acceso VIP:</span>
      <span class="value" th:text="${response.passenger.vipAccess}"></span>
    </div>

    <a th:href="@{/flight/form}" class="btn-back">Volver a solicitar</a>
  </div>
  <!-- <div th:if="${response == null or response.passenger == null}">
    <p>No hay resultados disponibles</p>
  </div> -->
</body>
</html>
